<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Korea Chat Go</title>

  <!-- XSS 방어 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      img-src 'self' data: blob:;
      media-src 'self' blob:;
      script-src 'self';
      style-src 'self' 'unsafe-inline';
    "
  >

  <link
    rel="stylesheet"
    href="style.css?v=5"
  >

</head>

<body>

  <h1>Korea Chat Go</h1>





  <!-- 닉네임 -->

  <div>

    닉네임:

    <input
      id="nickname"
      maxlength="30"
      autocomplete="off"
    >

    <button
      type="button"
      onclick="saveNickname()"
    >
      저장
    </button>

    <button
      type="button"
      onclick="changeNickname()"
    >
      변경
    </button>

  </div>





  <h2>방 목록</h2>

  <input
    id="searchRoom"
    autocomplete="off"
    placeholder="방 검색"
  >

  <button
    type="button"
    onclick="loadRooms()"
  >
    검색
  </button>

  <ul id="roomList"></ul>





  <h2>방 만들기</h2>

  <input
    id="roomName"
    placeholder="방 이름"
    maxlength="50"
    autocomplete="off"
  >

  <label>

    <input
      type="checkbox"
      id="privateCheck"
    >

    비밀번호

  </label>

  <input
    id="roomPassword"
    placeholder="비밀번호"
    maxlength="50"
    autocomplete="off"
  >

  <button
    type="button"
    onclick="createRoom()"
  >
    생성
  </button>





  <hr>

  <h2 id="currentRoom"></h2>





  <div class="chat-wrapper">

    <div>

      <div id="chat"></div>

      <input
        id="message"
        placeholder="메시지를 입력"
        maxlength="1000"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="sendMessage()"
      >
        전송
      </button>

      <br><br>

      <input
        type="file"
        id="fileInput"

        accept="
          image/png,
          image/jpeg,
          image/gif,
          image/webp,
          video/mp4,
          video/webm,
          video/ogg
        "
      >

      <button
        type="button"
        onclick="uploadFile()"
      >
        업로드
      </button>

    </div>





    <div class="sidebar">

      <h3>접속자</h3>

      <div id="users"></div>

    </div>

  </div>





  <!-- socket.io -->

<script src="/socket.io/socket.io.js"></script>
<script src="client.js?v=6"></script>

<script>

window.addEventListener(
  'error',
  (e) => {

    console.error(
      'GLOBAL ERROR:',
      e.message
    );
  }
);

</script>

</body>
</html>
